<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cesta Limpa | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="css/estilologin.css" />
</head>

<body class="login-page" onload="listar()">

  <div class="header">
    <div class="container header-container">

      <div class="logo">
        <img src="./assets/icon/cesta-basquete.png">
        <h1>Cesta Limpa</h1>
      </div>

      <div class="menu">
        <a href="index.html">Home</a>
        <a href="simulador.html">Simulador</a>
        <a href="cadastro.html" class="active">Cadastro</a>
        <a href="login.html">Login</a>
        <a href="javascript:void(0)" onclick="validarSessao()">quiz</a>
      </div>
    </div>
  </div>

  <div class="login-main">
    <div>
      <div class="alerta_erro">
        <div class="card_erro" id="cardErro">
          <span id="mensagem_erro"></span>
        </div>
      </div>

      <div class="login-card">
        <h2>Crie sua conta</h2>
        <p>
          Compare seu desempenho com jogadores da NBA <img src="./assets/icon/bola-de-basquete.png" width="30px">
        </p>

        <div class="formulario">
          <div class="campo">
            <span>Time favorito</span>
            <input id="codigo_input" type="text" placeholder="Ex: Los Angeles Lakers" />
          </div>

          <div class="campo">
            <span>Nome</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>

          <div class="campo">
            <span>E-mail</span>
            <input id="email_input" type="text" placeholder="seuemail@gmail.com" />
          </div>

          <div class="campo">
            <span>Senha</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>

          <div class="campo">
            <span>Confirmar senha</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>

          <button class="botao" onclick="cadastrar()">
            Criar conta
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="login-footer">
    <div class="login-container">
      <h4> CestaLimpa © 2026 <img src="./assets/icon//bola-de-basquete-fogo.png" width="30px"CestaLimpa © 2026></h4>
      <span class="version">Projeto NBA</span>
    </div>
  </div>

</body>

</html>

<script>
  let listaTimesCadastrados = [];

  function cadastrar() {
    var nomeVar = nome_input.value.trim();
    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value.trim();
    var confirmacaoSenhaVar = confirmacao_senha_input.value.trim();
    var codigoVar = codigo_input.value.trim();

    var idTimeVincular;

     if (emailVar == "" || senhaVar == "") {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Preencha todos os campos.";
      valido = false;
    } else if (!emailVar.includes("@")) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Email inválido.";
      valido = false;
    } else if (senhaVar.length < 8) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "A senha deve ter pelo menos 8 caracteres.";
      valido = false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não coincidem.";
      return false;
    }

    for (let i = 0; i < listaTimesCadastrados.length; i++) {
      if (listaTimesCadastrados[i].codigo_ativacao.toLowerCase() == codigoVar.toLowerCase()) {
        idTimeVincular = listaTimesCadastrados[i].id;
        console.log("Código válido! ID do Time: " + idTimeVincular);
        break;
      }
    }

    if (idTimeVincular == undefined) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Time favorito inválido ou não encontrado.";
      return false;
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idTimeVincularServer: idTimeVincular 
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";
          mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando...";

          setTimeout(() => {
            window.location = "login.html";
          }, 2000);
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
      });

    return false;
  }

  function listar() {
    fetch("/times/listar", { 
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((times) => {
          times.forEach((time) => {
            listaTimesCadastrados.push(time);
          });
          console.log("Lista de times carregada:", listaTimesCadastrados);
        });
      })
      .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
