<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta Limpa | Dashboard</title>
    <link rel="stylesheet" href="../css/dashboards.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="janela">
        <div class="header-left">
            <h1>Cesta Limpa</h1>
            <div class="aprensentacao">
                <h3>
                    Olá,
                    <span id="b_usuario">usuário</span>
                </h3>
            </div>

            <div class="btn-nav">
                <h3>Dashboard</h3>
            </div>

            <a href="../quiz/quiz.html">
                <div class="btn-nav-white">
                    <h3>Quiz NBA</h3>
                </div>

            </a>

            <div class="btn-nav-white">
                <a href="../calduladora/calculadora.html">
                    <h3>calculadora</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="../index.html">
                    <h3>Voltar para Home</h3>
                </a>
            </div>
        </div>

        <div class="dash">
            <div class="topo-dash">
                <h1>Seu Perfil NBA </h1>
                <p>Descubra qual lenda da NBA mais combina com você</p>
            </div>

            <div class="kpis">
                <div class="kpi-card">
                    <h3>Jogador que mais parece</h3>
                    <span id="kpiMaior">---</span>
                </div>

                <div class="kpi-card">
                    <h3>Jogador que menos aparece</h3>
                    <span id="kpiMenor">---</span>
                </div>
            </div>

            <div class="graficos">
                <div class="grafico-card">
                    <h2>Distribuição do Resultado</h2>
                    <div class="graph">
                        <canvas id="graficoPizza"></canvas>
                    </div>
                </div>
                <div class="grafico-card">
                    <h2>Porcentagem de Similaridade</h2>
                    <div class="graph">
                        <canvas id="graficoBarra"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
<script>

    b_usuario.innerHTML =
        sessionStorage.NOME_USUARIO;

    window.onload =
        obterDadosGrafico();

    function obterDadosGrafico() {
        const idUsuario = sessionStorage.ID_USUARIO;
        if (idUsuario == undefined || idUsuario == null || idUsuario == "") {
            alert("Usuário não encontrado");
            window.location =
                "../login.html";
            return;
        }

        fetch(
            `/quiz/buscarResultado/${idUsuario}`,
            {
                cache: 'no-store'
            }
        )
            .then(function (response) {
                if (response.ok) {
                    response.json()
                        .then(function (resposta) {
                            if (resposta.length <= 0) {
                                alert("Você ainda não fez o quiz!");
                                return;
                            }
                            plotarGraficos(resposta);
                        });
                } else {
                    console.error("Nenhum dado encontrado");
                }
            })

            .catch(function (erro) {
                console.log(erro);
            });
    }

    function plotarGraficos(resposta) {
        let resultado = resposta[0];
        let curry = Number(resultado.porcentagem_curry);
        let lebron = Number(resultado.porcentagem_lebron);
        let magic = Number(resultado.porcentagem_magic);
        let shaq = Number(resultado.porcentagem_shaq);

        const jogadores = [
            {
                nome: "Stephen Curry",
                valor: curry
            },

            {
                nome: "LeBron James",
                valor: lebron
            },

            {
                nome: "Magic Johnson",
                valor: magic
            },

            {
                nome: "Shaquille O'Neal",
                valor: shaq
            }
        ];

        let maior = jogadores[0];
        let menor = jogadores[0];

        for (
            let i = 0;
            i < jogadores.length;
            i++
        ) {

            if (jogadores[i].valor > maior.valor) {
                maior = jogadores[i];
            }

            if (jogadores[i].valor < menor.valor) {
                menor = jogadores[i];
            }
        }

        kpiMaior.innerHTML = `
            ${maior.nome}
            <br>
            <span style="
                font-size: 22px;
                color: #999;
                font-weight: 600;
            ">
                ${maior.valor.toFixed(0)}%
            </span>
        `;

        kpiMenor.innerHTML = `
            ${menor.nome}
            <br>
            <span style="
                font-size: 22px;
                color: #999;
                font-weight: 600;
            ">
                ${menor.valor.toFixed(0)}%
            </span>
        `;

        new Chart(
            document.getElementById(
                "graficoPizza"
            ),
            {
                type: 'doughnut',
                data: {
                    labels: [
                        "Stephen Curry",
                        "LeBron James",
                        "Magic Johnson",
                        "Shaquille O'Neal"
                    ],

                    datasets: [{
                        data: [
                            curry,
                            lebron,
                            magic,
                            shaq
                        ],

                        backgroundColor: [
                            "#ff9f43",
                            "#3b82f6",
                            "#a855f7",
                            "#10b981"
                        ],
                        borderWidth: 0,
                        hoverOffset: 20
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '68%',
                    animation: {
                        animateRotate: true,
                        duration: 1800
                    },

                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: "#555",
                                padding: 20,
                                font: {
                                    size: 14,
                                    weight: '500'
                                },
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        }
                    }
                }
            }
        );

        new Chart(
            document.getElementById(
                "graficoBarra"
            ),
            {
                type: 'bar',
                data: {
                    labels: [
                        "Curry",
                        "LeBron",
                        "Magic",
                        "Shaq"
                    ],

                    datasets: [{
                        label: 'Similaridade %',
                        data: [
                            curry,
                            lebron,
                            magic,
                            shaq
                        ],
                        backgroundColor: [
                            "#ff9f43",
                            "#3b82f6",
                            "#a855f7",
                            "#10b981"
                        ],
                        borderRadius: 18,
                        borderSkipped: 'bottom',
                        barThickness: 60
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 1800,
                        easing: 'easeOutQuart'
                    },

                    plugins: {
                        legend: {
                            display: false
                        }
                    },

                    scales: {
                        x: {
                            ticks: {
                                color: "#666",
                                font: {
                                    size: 14,
                                    weight: '600'
                                }
                            },

                            grid: {
                                display: false
                            },

                            border: {
                                display: false
                            }
                        },

                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                color: "#999",
                                callback: function (value) {
                                    return value + "%";
                                },

                                font: {
                                    size: 13
                                }
                            },

                            grid: {
                                color: "#ececec"
                            },

                            border: {
                                display: false
                            }
                        }
                    }
                }
            }
        );
    }

</script>
