<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz NBA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body onload="onloadEsconder()">

    <div id="pontuacaoEJogo">

        <button id="btnIniciarQuiz" onclick="iniciarQuiz()">
            INICIAR QUIZ
        </button>

        <div id="pontuacao" class="flex-colunar width-fit-content border-primary">

            <div id="pontuacaoDuranteJogo" class="flex-colunar padding-8">

                <span class="width-fit-content">
                    Respostas feitas:
                    <span id="spanCertas"></span>
                </span>

            </div>

            <div id="pontuacaoFinalJogo" class="flex-colunar padding-8">

                <span id="pontuacaoFinal" class="width-fit-content">

                    Jogador parecido:
                    <span id="spanPontuacaoFinal">***</span>

                </span>

                <span id="msgFinal" class="width-fit-content">
                    ***
                </span>

            </div>

        </div>

        <div id="jogo" class="width-fit-content flex-colunar border-secondary">

            <div id="infoQuestao" class="padding-8">

                <span>

                    Questão atual:
                    <span id="spanNumeroDaQuestaoAtual"></span>

                    de

                    <span id="qtdQuestoes"></span>
                    questões.

                </span>

            </div>

            <div id="perguntaDaQuestaoAtual" class="padding-8">

                <span id="spanQuestaoExibida" class="text-bold"></span>

            </div>

            <div id="infoAlternativas" class="padding-8">

                <span>
                    <em>Escolha uma opção:</em>
                </span>

            </div>

            <div id="opcoes" class="flex-colunar padding-8">

                <span>

                    <input
                        type="radio"
                        id="primeiraOpcao"
                        name="option"
                        value="alternativaA"
                    >

                    <label
                        for="primeiraOpcao"
                        id="labelOpcaoUm"
                    ></label>

                </span>

                <span>

                    <input
                        type="radio"
                        id="segundaOpcao"
                        name="option"
                        value="alternativaB"
                    >

                    <label
                        for="segundaOpcao"
                        id="labelOpcaoDois"
                    ></label>

                </span>

                <span>

                    <input
                        type="radio"
                        id="terceiraOpcao"
                        name="option"
                        value="alternativaC"
                    >

                    <label
                        for="terceiraOpcao"
                        id="labelOpcaoTres"
                    ></label>

                </span>

                <span>

                    <input
                        type="radio"
                        id="quartaOpcao"
                        name="option"
                        value="alternativaD"
                    >

                    <label
                        for="quartaOpcao"
                        id="labelOpcaoQuatro"
                    ></label>

                </span>

            </div>

            <div id="botoes" class="flex-colunar padding-8">

                <button onclick="submeter()" id="btnSubmeter">
                    Submeter resposta
                </button>

                <button onclick="avancar()" id="btnProx" disabled>
                    Avançar
                </button>

                <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>
                    Tentar novamente
                </button>

            </div>

        </div>

    </div>

    <script src="quiz.js"></script>

</body>

</html>
