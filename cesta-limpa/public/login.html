<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesta Limpa | Login</title>
  <script src="./js/sessao.js"></script>
  <link rel="stylesheet" href="./css/estilologin.css">
</head>

<body class="login-page">

  <div class="login-header">
    <div class="login-container">
      <div class="logo-login">
        <img src="./assets/icon/cesta-basquete.png">
        <h1>Cesta Limpa</h1>
      </div>
      <div class="login-navbar">
        <a href="index.html">Home</a>
        <a href="#">Dashboard</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html" class="active">Login</a>
      </div>
    </div>
  </div>

  <div class="login-main">
    <div>
      <div class="alerta_erro">
        <div class="card_erro" id="cardErro">
          <span id="mensagem_erro"></span>
        </div>
      </div>

      <div class="login-card">
        <h2>Bem-vindo de volta</h2>
        <p>
          Entre e descubra como você se compara aos astros da NBA
          <img src="./assets/icon/bola-de-basquete.png" width="30px">
        </p>

        <div class="formulario">
          <div class="campo">
            <span>E-mail</span>
            <input id="email_input" type="text" placeholder="seuemail@gmail.com">
          </div>
          <div class="campo">
            <span>Senha</span>
            <input id="senha_input" type="password" placeholder="******">
          </div>
          <button class="botao" id="botao_login" onclick="entrar()">Entrar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="login-footer">
    <div class="login-container">
      <h4>#CestaLimpa © 2026</h4>
      <span class="version">Projeto NBA</span>
    </div>
  </div>

</body>

</html>

<script>

  var tentativas = 0;

  function entrar() {

    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value.trim();

    var valido = true;

    if (emailVar == "" || senhaVar == "") {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Preencha todos os campos.";
      valido = false;
    } else if (!emailVar.includes("@")) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Email inválido.";
      valido = false;
    } else if (senhaVar.length < 8) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "A senha deve ter pelo menos 8 caracteres.";
      valido = false;
    }

    if (valido) {
      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          emailServer: emailVar,
          senhaServer: senhaVar
        })
      })
      .then(function (resposta) {
        console.log("ESTOU NO THEN DO entrar()!");

        if (resposta.ok) {
          resposta.json().then(json => {
            console.log(json);

            sessionStorage.EMAIL_USUARIO = json.email;
            sessionStorage.NOME_USUARIO = json.nome;
            sessionStorage.ID_USUARIO = json.id;

            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Login realizado com sucesso!";

            setTimeout(function () {
              window.location = "./quiz/quiz.html";
            }, 1000);
          });

        } else {
          tentativas++;

          cardErro.style.display = "block";

          if (tentativas >= 3) {
            botao_login.disabled = true;
            botao_login.style.opacity = "0.5";
            mensagem_erro.innerHTML = "Login bloqueado após 3 tentativas.";
          } else {
            mensagem_erro.innerHTML = `Email ou senha inválidos. Tentativa ${tentativas} de 3.`;
          }
        }
      })
      .catch(function (erro) {
        console.log(erro);
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Erro ao conectar com o servidor.";
      });
    }
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }

</script>
